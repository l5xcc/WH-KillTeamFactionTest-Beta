<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>워해머 40K: 킬팀 팩션 성향 테스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <span class="badge">WARHAMMER 40,000 : KILL TEAM</span>
    <h1>나에게 맞는 킬팀 팩션 찾기</h1>
    <p>
      <strong>워해머 40K: 킬팀(Kill Team)</strong>은 대규모 전쟁이 아닌, 6명에서 14명 남짓한 소규모 특수작전 분대(Operatives)를 지휘하여 적의 후방을 타격하고 기밀 임무를 수행하는 전략 미니어처 보드게임입니다.
    </p>
    <div class="result-box">
      <div class="stat-row">
        <span><strong>소요 시간</strong></span>
        <span>약 1~2분 (총 6문항)</span>
      </div>
      <div class="stat-row">
        <span><strong>분석 기준</strong></span>
        <span>전투 스타일 / 외형 및 로어 취향 / 전술 성향</span>
      </div>
    </div>
    <p>
      초인 전사부터 참호전의 보병, 은신하는 외계 특공대까지 당신의 전술 성향에 가장 완벽하게 부합하는 킬팀을 추천해 드립니다.
    </p>
    <button class="btn btn-primary" onclick="startTest()">성향 테스트 시작하기</button>
  </div>

  <script>
    function startTest() {
      localStorage.removeItem('kt_answers');
      window.location.href = 'test.html';
    }
  </script>
</body>
</html>
