<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분석 결과 - 워해머 킬팀 테스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <span class="badge">RECOMMENDED KILL TEAM</span>
    <h1 id="res-name">결과 분석 중...</h1>
    <p id="res-group"></p>

    <div class="result-box">
      <div class="stat-row">
        <span><strong>플레이 방식</strong></span>
        <span id="res-style"></span>
      </div>
      <div class="stat-row">
        <span><strong>취향 키워드</strong></span>
        <span id="res-taste"></span>
      </div>
    </div>

    <p id="res-desc" style="color: #e2e8f0; font-size: 1.05rem;"></p>

    <button class="btn btn-primary" onclick="restartTest()">처음으로 돌아가기</button>

    <div class="all-factions">
      <h2>전체 킬팀 팩션 도감 및 적합도</h2>
      <div id="all-factions-list"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    function loadResult() {
      const saved = localStorage.getItem('kt_answers');
      if (!saved) {
        window.location.href = 'index.html';
        return;
      }

      const answers = JSON.parse(saved);
      const scores = {};
      Object.keys(FACTIONS).forEach(key => scores[key] = 0);

      // 점수 합산
      answers.forEach((ansIdx, qIdx) => {
        if (ansIdx !== null && QUESTIONS[qIdx]) {
          const scoreMap = QUESTIONS[qIdx].options[ansIdx].scores;
          for (const [fKey, pt] of Object.entries(scoreMap)) {
            if (scores[fKey] !== undefined) {
              scores[fKey] += pt;
            }
          }
        }
      });

      // 점수 순 정렬
      const sortedFactions = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const bestKey = sortedFactions[0];
      const bestFaction = FACTIONS[bestKey];

      // 1위 팩션 렌더링
      document.getElementById('res-name').innerText = bestFaction.name;
      document.getElementById('res-group').innerText = bestFaction.group;
      document.getElementById('res-style').innerText = bestFaction.style;
      document.getElementById('res-taste').innerText = bestFaction.taste;
      document.getElementById('res-desc').innerText = bestFaction.desc;

      // 전체 팩션 도감 및 획득 점수 출력
      const listContainer = document.getElementById('all-factions-list');
      sortedFactions.forEach((key, idx) => {
        const f = FACTIONS[key];
        const card = document.createElement('div');
        card.className = 'faction-mini-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <strong style="color: ${idx === 0 ? '#e65c00' : '#ffffff'};">${idx + 1}위. ${f.name}</strong>
            <span style="color: #94a3b8; font-size:0.85rem;">매칭 점수: ${scores[key]}점</span>
          </div>
          <div style="font-size:0.85rem; color:#94a3b8;">${f.style} | ${f.taste}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    function restartTest() {
      localStorage.removeItem('kt_answers');
      window.location.href = 'index.html';
    }

    loadResult();
  </script>
</body>
</html>
